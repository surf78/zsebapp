<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="utf-8" />
    <!-- Nagyítás tiltva: az app natív appként viselkedjen -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>ZsebApp</title>
    <!-- GitHub Pages-re publikáláskor a workflow ezt átírja "/<repo-név>/"-re. -->
    <base href="/" />

    <!-- iPhone: teljes képernyős futás a főképernyőről indítva -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ZsebApp" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#2b9fe0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a1c28" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <link href="manifest.webmanifest" rel="manifest" />

    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="splash">
            <img src="icon-192.png" alt="" width="96" height="96" />
            <svg class="loading-progress">
                <circle r="40%" cx="50%" cy="50%" />
                <circle r="40%" cx="50%" cy="50%" />
            </svg>
            <div class="loading-progress-text"></div>
        </div>
    </div>

    <div id="blazor-error-ui">
        Váratlan hiba történt.
        <a href="." class="reload">Újratöltés</a>
        <span class="dismiss">✕</span>
    </div>
    <script src="js/zseb.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/sync.bundle.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>
        // Frissítés: megnyitáskor és amikor az app újra előtérbe kerül, megnézzük, van-e új verzió.
        // Ha az új verzió átvette az irányítást, újratöltünk – de nem gépelés vagy hangfelvétel közben.
        (function () {
            if (!('serviceWorker' in navigator)) return;
            const hadController = !!navigator.serviceWorker.controller;
            let pending = false, reloading = false;
            const busy = function () {
                const a = document.activeElement;
                return !!(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) ||
                    !!(window.zseb && window.zseb.speech && window.zseb.speech._session);
            };
            const reload = function () {
                if (reloading) return;
                if (busy()) { pending = true; return; }
                reloading = true;
                location.reload();
            };
            navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' }).then(function (reg) {
                document.addEventListener('visibilitychange', function () {
                    if (document.visibilityState !== 'visible') return;
                    if (pending) { reload(); return; }
                    reg.update().catch(function () { });
                });
            });
            navigator.serviceWorker.addEventListener('controllerchange', function () {
                if (hadController) reload();     // első telepítésnél nem kell újratölteni
            });
        })();
    </script>
</body>

</html>
