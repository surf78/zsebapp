name: Publikálás GitHub Pagesre

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # A base href-et a build ELŐTT kell átírni, különben a service worker
      # integritás-ellenőrzése elbukik a módosított index.html miatt.
      - name: Base href beállítása
        run: |
          REPO="${{ github.event.repository.name }}"
          if [[ "$REPO" == *.github.io ]]; then BASE="/"; else BASE="/$REPO/"; fi
          sed -i "s|<base href=\"/\" />|<base href=\"$BASE\" />|" src/ZsebApp/wwwroot/index.html
          grep -n "<base" src/ZsebApp/wwwroot/index.html

      - name: Publish
        run: dotnet publish src/ZsebApp/ZsebApp.csproj -c Release -o release

      # 404.html = index.html, így a közvetlen linkek (pl. /kiadasok) is betöltik az appot.
      # .nojekyll: a _framework mappát a GitHub Pages különben nem szolgálná ki.
      - name: GitHub Pages előkészítés
        run: |
          cp release/wwwroot/index.html release/wwwroot/404.html
          touch release/wwwroot/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: release/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
